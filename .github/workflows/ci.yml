name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # The default shell on runners is `bash -e`. This one adds pipefail, which the
    # annotation pipes below rely on.
    shell: bash

env:
  # Fail instead of rewriting uv.lock.
  UV_LOCKED: "1"

jobs:
  lint-type:
    name: lint-type
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: |
          uv run ruff format --check . 2>&1 \
            | sed -E 's/^Would reformat: (.+)$/::error file=\1::ruff format would change this file/'
      - name: mypy
        run: |
          uv run mypy \
            | sed -E 's/^(.+):([0-9]+): error: (.*)$/::error title=mypy,file=\1,line=\2::\3/'

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync
      - name: pytest
        run: uv run pytest tests/unit tests/invariants -m "not services and not docker and not e2e and not slow"

  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync
      # Every case must decide as it says, and every policy must be matched by a case: a pull
      # request that opens access by accident flips a case, and one that adds a rule nobody tests
      # lists it as unmatched.
      - name: policy cases
        run: uv run keystone policy test policies tests/policy_cases --coverage

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Mapped to the compose host ports, so the default settings work unchanged.
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: keystone
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U keystone -d keystone"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.11
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync
      - name: migrate
        run: uv run alembic upgrade head
      # The tests marked `docker` run code in the sandbox (KS-801) and a stdio server in a container
      # (KS-803). The runner has Docker, and these are the two images they use.
      - name: build the sandbox image
        run: docker build -q -t keystone-sandbox-python:dev -f deploy/sandbox/Dockerfile.python deploy/sandbox
      - name: build the echo server image
        run: docker build -q -t keystone-echo-stdio:dev -f examples/upstreams/Dockerfile.echo .
      - name: pytest
        env:
          # A missing daemon or image fails a docker test here, and does not skip it.
          KEYSTONE_REQUIRE_DOCKER: "1"
        run: uv run pytest tests/integration tests/invariants -m "not e2e and not slow"

  console:
    name: console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The generated types are compared with the API's own schema, so Python runs here too.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync
      # pnpm's version is the `packageManager` field of console/package.json, and Node's is the
      # major in console/.nvmrc, so a developer and CI run the same ones.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: install
        run: pnpm --dir console install --frozen-lockfile
      # The console's types are generated from the API. A change to a route or a model that was
      # not followed by `make console-types` leaves the committed file behind the API.
      - name: generated types match the API
        run: |
          make console-types
          if ! git diff --exit-code -- console/src/api/schema.d.ts; then
            echo "::error file=console/src/api/schema.d.ts::out of date with the admin API, run make console-types and commit the result"
            exit 1
          fi
      - name: eslint
        run: |
          status=0
          pnpm --dir console exec eslint . --format json --output-file "$RUNNER_TEMP/eslint.json" || status=$?
          jq -r '.[] | .filePath as $f | .messages[]
            | "::\(if .severity == 2 then "error" else "warning" end) file=\($f | sub(env.GITHUB_WORKSPACE + "/"; "")),line=\(.line),col=\(.column)::\(.ruleId // "eslint"): \(.message | gsub("\n"; "%0A"))"' \
            "$RUNNER_TEMP/eslint.json"
          exit "$status"
      - name: prettier
        run: |
          pnpm --dir console exec prettier --check . 2>&1 \
            | sed -E 's#^\[warn\] ([^ ]+)$#::error file=console/\1::prettier would change this file#'
      - name: tsc
        run: |
          pnpm --dir console exec tsc -b 2>&1 \
            | sed -E 's#^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)$#::error title=tsc,file=console/\1,line=\2,col=\3::\4 \5#'
      - name: unit tests
        run: pnpm --dir console test
      - name: build
        run: pnpm --dir console build

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync
      - name: install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: gitleaks over full history
        run: |
          if ! gitleaks git --no-banner --redact --report-format json --report-path gitleaks.json .; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:8])"' gitleaks.json
            exit 1
          fi
      - name: pip-audit
        run: |
          uv export --no-emit-project -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --no-deps --disable-pip

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker build -t keystone:ci .
      - name: smoke
        run: |
          docker run --rm keystone:ci --help
          docker run --rm keystone:ci version

  commits:
    name: commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check commit subjects since main
        run: |
          status=0
          while IFS= read -r subject; do
            python3 scripts/check_commit_msg.py "$subject" || status=1
          done < <(git log origin/main..HEAD --no-merges --format=%s)
          exit "$status"

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: prose lint
        run: python3 scripts/lint_prose.py
