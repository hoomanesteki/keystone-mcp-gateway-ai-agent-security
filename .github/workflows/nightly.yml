name: Nightly

# The end-to-end tests need the whole compose stack (Keycloak, the demo upstreams, Keystone), so
# they run here and at every phase gate instead of on each push. Run it by hand from the Actions
# tab, or locally with `make up && make test-e2e && make console-e2e`. The last one drives the
# console in a browser (Playwright, chromium).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Fail instead of rewriting uv.lock.
  UV_LOCKED: "1"

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: console dependencies and browser
        run: |
          pnpm --dir console install --frozen-lockfile
          pnpm --dir console exec playwright install --with-deps chromium
      - name: start the stack
        run: make up
      - name: end-to-end tests
        run: make test-e2e
      - name: console end-to-end test
        run: make console-e2e
      # 10 sessions making 5 calls each to the echo upstream and to Keystone (KS-903). It checks
      # that the harness still runs and that no call fails; the numbers are the ones of the full
      # matrix, which needs a machine of its own (docs/runbook.md, Performance).
      - name: performance smoke
        run: make perf-smoke
      - name: container logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=200
      - name: stop the stack
        if: always()
        run: make down

  # The detector evaluation (KS-707) on a sample of 200 texts of the dev split, scored by the rules
  # alone: no model is installed or downloaded in CI. The public datasets are downloaded when the
  # runner can reach them (the run says so when it cannot, and goes on with the synthetic texts).
  # It fails when the data differs from eval/detector/manifest.json, and when the rules rank the
  # sample worse than the guard below. It reads dev and never the test split, which is for the
  # numbers that are published and is looked at when the thresholds change.
  detector:
    name: detector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --extra eval
      - name: evaluate the rules on 200 samples
        run: |
          set -o pipefail
          uv run python -m eval.detector.run --config rules --split dev --limit 200 \
            --fail-under-auc 0.7 --summary | tee -a "$GITHUB_STEP_SUMMARY"
