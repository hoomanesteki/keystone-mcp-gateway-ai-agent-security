# Copy to keystone.yaml and point KEYSTONE_CONFIG at it. Secrets never go in this file.
# Environment variables override anything set here.
log_level: info

# One Keystone can serve several tenants. A token's `tenant` claim picks one, and a caller sees only
# that tenant's upstreams and tools. An upstream id is unique across tenants.
tenants:
  - id: acme
    name: Acme Corp
  - id: globex
    name: Globex Inc

# The MCP servers Keystone proxies. Each tool is exposed as <id>__<tool>, for example mail__read_email.
# These URLs reach the demo upstreams that `make up` publishes on the host. Inside compose they are
# http://mail-mcp:8101/mcp and so on.
upstreams:
  # Optional per-tool settings, by the upstream's own tool name. A tool left out has risk medium
  # and no tags.
  - id: mail
    tenant: acme
    transport: http
    url: "http://localhost:8101/mcp"
    # The demo servers need an API key when MAIL_API_KEY is set. credential_env names the variable
    # Keystone reads it from at startup, to store it encrypted in the vault (needs
    # KEYSTONE_MASTER_KEYS). The key itself never goes in this file.
    credential_mode: static
    credential_env: {X-Api-Key: MAIL_API_KEY}
    tools:
      read_email: {risk: low, tags: [reads_untrusted, reads_sensitive]}
      send_email: {risk: high, tags: [external_effect], extract: {recipient_domain: "$.to | domain"}}
  - {id: files, tenant: acme, transport: http, url: "http://localhost:8102/mcp"}
  - id: bank
    tenant: acme
    transport: http
    url: "http://localhost:8103/mcp"
    tools:
      get_balance: {risk: medium, tags: [reads_sensitive]}
      # The amount in cents: `int` would cut 500.99 down to 500 and let it past a limit of 500.
      transfer: {risk: high, tags: [external_effect], extract: {amount: "$.amount | cents"}}
  - {id: echo, tenant: acme, transport: http, url: "http://localhost:8104/mcp"}
  # Fixture pages that some carry an instruction for the agent that reads them (KS-708).
  - id: web
    tenant: acme
    transport: http
    url: "http://localhost:8105/mcp"
    tools:
      fetch: {risk: low, tags: [reads_untrusted]}
  # Globex's own drive: `python -m examples.upstreams.files_server --port 8112` with
  # FILES_SEED=examples/fixtures/files-globex. Only globex's users see its tools.
  - id: files_globex
    tenant: globex
    transport: http
    url: "http://localhost:8112/mcp"

# The policies (Cedar). root has schema.cedarschema, default/, one directory per tenant, and demo/.
# A tenant's rules are default/ plus demo/ (if include_demo) plus its own directory, each with an
# access/ and an approval/ part. Both can be set with KEYSTONE_POLICY__<NAME>. See docs/runbook.md.
policy:
  root: policies
  include_demo: false

# Sign-in. KEYSTONE_OIDC_ISSUER is the `iss` of valid tokens (required); see docs/runbook.md for the
# other OIDC variables. `mode: none` skips the check and makes every caller the dev principal. It is
# refused unless env is dev or test.
auth:
  mode: oidc
  allow_unknown_agents: false

# The agents (OAuth clients, the token's `azp`) that may connect, and how far each is trusted:
# low, standard or high. An agent that is not listed is refused with 403 unless
# auth.allow_unknown_agents is true, and then it gets trust low.
agents:
  support-agent: {trust: standard}
  ops-agent: {trust: high}

# How the tool list is kept current. All three can be set with KEYSTONE_REGISTRY__<NAME>.
registry:
  sync_interval_s: 300   # 0 turns the timer off
  sync_timeout_s: 20
  cache_ttl_s: 2

# Probes of the upstreams. An upstream that fails `down_after` probes in a row is refused calls
# until a probe succeeds. All four can be set with KEYSTONE_HEALTH__<NAME>.
health:
  interval_s: 30   # 0 turns the probes off
  timeout_s: 3
  degraded_after: 1
  down_after: 3

# Where traces go: an OTLP/HTTP endpoint (Jaeger takes it on :4318). Without it no spans are made and
# audit rows carry no trace id. Also KEYSTONE_OTLP_ENDPOINT.
# otlp_endpoint: http://localhost:4318

# The audit log (every call leaves a hash-chained row in Postgres). With fail_closed on, a call is
# refused before it runs while the audit writer is unhealthy (its queue over 90% full, or a flush
# failed less than 5 s ago), because an action with no record is what the log exists to prevent.
# Left out, it is true unless env is dev. Also KEYSTONE_AUDIT__FAIL_CLOSED.
audit:
  fail_closed: true
  # Argument keys whose values the log replaces with [redacted], besides keys that look like
  # secrets. Whole names, any case. Also KEYSTONE_AUDIT__REDACT_KEYS (a JSON list).
  redact_keys: [ssn, date_of_birth]

# Approvals: a call the policy sends to approval waits for a person (ADR-0010). The call is held
# `wait_seconds` in line; the agent that gets no answer by then is told KS_APPROVAL_PENDING with an
# id, and waits with the tool keystone__await_approval. A request can be decided and used for
# `ttl_seconds` after it was made, and once. The arguments of the call are kept encrypted with the
# vault's keys, so approvals need KEYSTONE_MASTER_KEYS. All of these can be set with
# KEYSTONE_APPROVALS__<NAME>.
approvals:
  wait_seconds: 60       # 0 never holds a call; at most 300
  ttl_seconds: 900
  sweep_interval_s: 30   # how often requests that ran out of time are marked expired
  poll_interval_s: 2     # how often a waiter looks at its request when Redis has not told it
  # Tell others when a request is made (ADR-0010). The webhook gets a signed JSON body and needs
  # KEYSTONE_APPROVALS_WEBHOOK_SECRET in the environment, at least 16 characters: the secret never
  # goes in this file.
  # A Slack incoming webhook gets a plain message. Its address is a secret, so prefer
  # KEYSTONE_APPROVALS__SLACK_WEBHOOK_URL. Neither delays the call.
  # webhook_url: https://hooks.example.test/keystone
  # slack_webhook_url: https://hooks.slack.com/services/...
