# Copy to keystone.yaml and point KEYSTONE_CONFIG at it. Secrets never go in this file.
# Environment variables override anything set here.
log_level: info

# One Keystone can serve several tenants. A token's `tenant` claim picks one, and a caller sees only
# that tenant's upstreams and tools. An upstream id is unique across tenants.
tenants:
  - id: acme
    name: Acme Corp
    # Default approval rules this tenant turns off (ADR-0018). The default asks before any external
    # effect once a session has read untrusted text; a tenant that wants only the Rule of Two lists:
    # exclude_default_policies: [untrusted-then-external-effect]
  - id: globex
    name: Globex Inc

# The MCP servers Keystone proxies. Each tool is exposed as <id>__<tool>, for example mail__read_email.
# These URLs reach the demo upstreams that `make up` publishes on the host. Inside compose they are
# http://mail-mcp:8101/mcp and so on.
upstreams:
  # Optional per-tool settings, by the upstream's own tool name. A tool left out has risk medium
  # and no tags.
  - id: mail
    tenant: acme
    transport: http
    url: "http://localhost:8101/mcp"
    # The demo servers need an API key when MAIL_API_KEY is set. credential_env names the variable
    # Keystone reads it from at startup, to store it encrypted in the vault (needs
    # KEYSTONE_MASTER_KEYS). The key itself never goes in this file.
    credential_mode: static
    credential_env: {X-Api-Key: MAIL_API_KEY}
    tools:
      list_emails: {risk: low, tags: [reads_sensitive]}
      read_email: {risk: low, tags: [reads_untrusted, reads_sensitive]}
      send_email: {risk: high, tags: [external_effect], extract: {recipient_domain: "$.to | domain"}}
  - id: files
    tenant: acme
    transport: http
    url: "http://localhost:8102/mcp"
    # What each tool is to the Rule of Two (policies/default/approval/rule_of_two.cedar). A drive
    # holds files that people outside the company wrote or touched, and private ones, so a read is
    # untrusted and sensitive; a write changes state. A tool with no tag is invisible to the rule.
    tools:
      list_files: {risk: medium, tags: [reads_sensitive]}
      read_file: {risk: medium, tags: [reads_untrusted, reads_sensitive]}
      write_file: {risk: medium, tags: [external_effect]}
  # The sandbox (ADR-0012): run_python and run_shell in a container with no network. It needs the
  # Docker socket and `make sandbox-image`, and `sandbox.enabled: false` leaves it out. Both tools
  # are high risk, so only operators may call them.
  - {id: sandbox, tenant: acme, transport: builtin}
  # A stdio server that you do not trust, run in a container with no network. The image must be
  # built already.
  # - id: crm
  #   tenant: acme
  #   transport: container_stdio
  #   image: crm-mcp:1.4
  #   command: [crm-server, --stdio]
  #   network: none   # or bridge
  - id: bank
    tenant: acme
    transport: http
    url: "http://localhost:8103/mcp"
    tools:
      # A price makes a call count against the budgets at the end of this file.
      get_balance: {risk: medium, tags: [reads_sensitive], cost_per_call_usd: 0.002}
      # The description of a transaction is written by whoever paid or was paid, so reading the
      # history is a read of untrusted text as well as of private data.
      list_transactions: {risk: medium, tags: [reads_untrusted, reads_sensitive]}
      # The amount in cents: `int` would cut 500.99 down to 500 and let it past a limit of 500.
      transfer: {risk: high, tags: [external_effect], extract: {amount: "$.amount | cents"}}
  - {id: echo, tenant: acme, transport: http, url: "http://localhost:8104/mcp"}
  # Fixture pages that some carry an instruction for the agent that reads them (KS-708).
  - id: web
    tenant: acme
    transport: http
    url: "http://localhost:8105/mcp"
    tools:
      fetch: {risk: low, tags: [reads_untrusted]}
  # Globex's own drive: `python -m examples.upstreams.files_server --port 8112` with
  # FILES_SEED=examples/fixtures/files-globex. Only globex's users see its tools.
  - id: files_globex
    tenant: globex
    transport: http
    url: "http://localhost:8112/mcp"
    # The same server as acme's drive, so its tools are what acme's are.
    tools:
      list_files: {risk: medium, tags: [reads_sensitive]}
      read_file: {risk: medium, tags: [reads_untrusted, reads_sensitive]}
      write_file: {risk: medium, tags: [external_effect]}

# The policies (Cedar). root has schema.cedarschema, default/, one directory per tenant, and demo/.
# A tenant's rules are default/ plus demo/ (if include_demo) plus its own directory, each with an
# access/ and an approval/ part. Both can be set with KEYSTONE_POLICY__<NAME>. See docs/runbook.md.
policy:
  root: policies
  include_demo: false

# Sign-in. KEYSTONE_OIDC_ISSUER is the `iss` of valid tokens (required); see docs/runbook.md for the
# other OIDC variables. `mode: none` skips the check and makes every caller the dev principal. It is
# refused unless env is dev or test.
auth:
  mode: oidc
  allow_unknown_agents: false

# The agents (OAuth clients, the token's `azp`) that may connect, and how far each is trusted:
# low, standard or high. An agent that is not listed is refused with 403 unless
# auth.allow_unknown_agents is true, and then it gets trust low.
agents:
  support-agent: {trust: standard}
  ops-agent: {trust: high}

# How the tool list is kept current. All three can be set with KEYSTONE_REGISTRY__<NAME>.
registry:
  sync_interval_s: 300   # 0 turns the timer off
  sync_timeout_s: 20
  cache_ttl_s: 2

# Probes of the upstreams. An upstream that fails `down_after` probes in a row is refused calls
# until a probe succeeds. All four can be set with KEYSTONE_HEALTH__<NAME>.
health:
  interval_s: 30   # 0 turns the probes off
  timeout_s: 3
  degraded_after: 1
  down_after: 3

# Where traces go: an OTLP/HTTP endpoint (Jaeger takes it on :4318). Without it no spans are made and
# audit rows carry no trace id. Also KEYSTONE_OTLP_ENDPOINT.
# otlp_endpoint: http://localhost:4318

# The audit log (every call leaves a hash-chained row in Postgres). With fail_closed on, a call is
# refused before it runs while the audit writer is unhealthy (its queue over 90% full, or a flush
# failed less than 5 s ago), because an action with no record is what the log exists to prevent.
# Left out, it is true unless env is dev. Also KEYSTONE_AUDIT__FAIL_CLOSED.
audit:
  fail_closed: true
  # Argument keys whose values the log replaces with [redacted], besides keys that look like
  # secrets. Whole names, any case. Also KEYSTONE_AUDIT__REDACT_KEYS (a JSON list).
  redact_keys: [ssn, date_of_birth]

# Approvals: a call the policy sends to approval waits for a person (ADR-0010). The call is held
# `wait_seconds` in line; the agent that gets no answer by then is told KS_APPROVAL_PENDING with an
# id, and waits with the tool keystone__await_approval. A request can be decided and used for
# `ttl_seconds` after it was made, and once. The arguments of the call are kept encrypted with the
# vault's keys, so approvals need KEYSTONE_MASTER_KEYS. All of these can be set with
# KEYSTONE_APPROVALS__<NAME>.
approvals:
  wait_seconds: 60       # 0 never holds a call; at most 300
  ttl_seconds: 900
  sweep_interval_s: 30   # how often requests that ran out of time are marked expired
  poll_interval_s: 2     # how often a waiter looks at its request when Redis has not told it
  # Tell others when a request is made (ADR-0010). The webhook gets a signed JSON body and needs
  # KEYSTONE_APPROVALS_WEBHOOK_SECRET in the environment, at least 16 characters: the secret never
  # goes in this file.
  # A Slack incoming webhook gets a plain message. Its address is a secret, so prefer
  # KEYSTONE_APPROVALS__SLACK_WEBHOOK_URL. Neither delays the call.
  # webhook_url: https://hooks.example.test/keystone
  # slack_webhook_url: https://hooks.slack.com/services/...

# The scanner reads the output of a tool for text that tries to steer the model (ADR-0011). A score
# under `suspicious` is benign, from `injection` up is an injection, and a score between is
# suspicious. `allowed_domains` are the hosts a markdown image may point to without a mark against it
# (a name covers its subdomains). The scan reads at most `max_scan_chars`: a longer text is read at
# both ends. All of these can be set with KEYSTONE_SCANNER__<NAME>.
#
# `classifier` is the model behind the rules: protectai-deberta-v2, prompt-guard-2-86m (needs the
# Llama license accepted on Hugging Face) or none. It needs the extra keystone[scanner]; without it
# the scanner runs on its rules alone and says so at start. A scan waits `classifier_timeout_ms` for
# the model and goes on with the rules when it has not answered. KEYSTONE_SCANNER_CLASSIFIER=none
# turns the model off.
scanner:
  enabled: true
  classifier: protectai-deberta-v2
  classifier_timeout_ms: 300
  # Scans in the model at once, and CPU threads for each. Unset, they follow the CPUs the process
  # may use and keep one for the event loop. A scan that finds no place is not queued: the rules
  # decide it and `model` says "busy".
  # classifier_concurrency: 1
  # classifier_threads: 3
  # How the score of the rules and the score of the model make one (ADR-0011). rules_first: a text
  # that the rules flag (their score is `thresholds.suspicious` or more) keeps their score and the
  # model is not asked; for any other text the model adds to the rules' score at `model_weight` of
  # its own, so on its own it can flag a text and cannot taint a session. max: the higher of the
  # two, and the model reads every text (what Phase 7 shipped).
  join: rules_first
  model_weight: 0.7
  # The model reads a long text in windows: this many tokens of the text in a window, and this many
  # shared with the window before. A short window keeps an attack from being lost in the document
  # around it, and costs more windows (more time) for a long text.
  window_tokens: 128
  window_overlap: 64
  thresholds: {suspicious: 0.5, injection: 0.85}
  # What is done to an output that scored suspicious or injection, by the risk of the tool: pass,
  # annotate (a warning and markers round it), redact (cut what hides or leaks, then annotate) or
  # block (withhold it).
  actions: {low: annotate, medium: annotate, high: redact, critical: block}
  allowed_domains: []
  max_scan_chars: 200000
  # A new tool is held for review when the rules score its description, or the description of a
  # field of its input schema, at or above this. The model is not used for descriptions.
  description_threshold: 0.5

# Where the code an agent writes runs (ADR-0012). Each run is a container with no network, a
# read-only root, 512 MB of memory and one CPU; those limits are not settings. It needs the Docker
# socket and the image from `make sandbox-image`. `enabled: false` (also KEYSTONE_SANDBOX_ENABLED=false)
# is for a host with no Docker. `runtime: runsc` runs the containers under gVisor, where it is
# installed. All of these can be set with KEYSTONE_SANDBOX__<NAME>.
sandbox:
  enabled: true
  image: keystone-sandbox-python:dev
  runtime: runc
  timeout_s: 30        # one run; its container is killed after this
  max_concurrent: 4    # containers at once

# How fast calls may come (KS-804). Each scope is a token bucket: `capacity` calls at once, and
# `refill_per_s` more every second. A call is checked against every scope that is set, and refused
# with KS_RATE_LIMITED and a retry_after_s by the first with no token. A scope left out has no limit.
# per_user is one user (the token's `sub`), per_agent one OAuth client, per_tool one tool for
# everybody, per_tenant everything a tenant does. Virtual tools and calls that wait for approval
# count too. Also KEYSTONE_RATE_LIMITS__PER_USER__CAPACITY and the like.
rate_limits:
  per_tenant: {capacity: 600, refill_per_s: 10}
  per_user: {capacity: 60, refill_per_s: 1}
  per_agent: {capacity: 120, refill_per_s: 2}
  per_tool: {capacity: 30, refill_per_s: 0.5}

# Spending limits (KS-805, ADR-0014). A call that would take the spend over one is refused before it
# runs, with KS_BUDGET_EXCEEDED, and the upstream sees nothing. A tool's price is its
# `cost_per_call_usd` under `upstreams[].tools`. `scope_id` is a user id (the token's `sub`) or an
# agent id (`azp`); a budget for the tenant leaves it out. Days and months are counted in UTC. The
# file is the only source: a budget that is not in it any more is removed at the next start.
budgets:
  - {tenant: acme, scope: tenant, window: day, limit_usd: 25}
  - {tenant: acme, scope: user, scope_id: olivia, window: day, limit_usd: 5}
  - {tenant: acme, scope: agent, scope_id: ops-agent, window: month, limit_usd: 200}

# The LLM proxy (KS-806, ADR-0016): an agent sends its model requests to Keystone with its Keystone
# token as the API key, and Keystone checks the token, stops a request that would take a budget over
# its limit, adds the provider's key from the vault and books what the request cost. Off by default.
# The prices are yours to fill in: copy pricing.example.yaml to pricing.yaml and write in the real
# ones from each provider's pricing page. A model that is not in the file is refused. The keys are
# read from the variables named here when Keystone starts and stored in the vault; they never go in
# this file. Also KEYSTONE_LLM_PROXY__<NAME>.
llm_proxy:
  enabled: false
  tenant: acme                  # whose keys; needed when there is more than one tenant
  pricing_file: pricing.yaml
  allow_unpriced: false         # true lets an unpriced model through at no cost, with a warning
  anthropic: {base_url: "https://api.anthropic.com", api_key_env: ANTHROPIC_API_KEY}
  openai: {base_url: "https://api.openai.com", api_key_env: OPENAI_API_KEY}
