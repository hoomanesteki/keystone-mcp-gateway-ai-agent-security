# Copy to keystone.yaml and point KEYSTONE_CONFIG at it. Secrets never go in this file.
# Environment variables override anything set here.
log_level: info

tenants:
  - id: acme
    name: Acme Corp

# The MCP servers Keystone proxies. Each tool is exposed as <id>__<tool>, for example mail__read_email.
# These URLs reach the demo upstreams that `make up` publishes on the host. Inside compose they are
# http://mail-mcp:8101/mcp and so on.
upstreams:
  # Optional per-tool settings, by the upstream's own tool name. A tool left out has risk medium
  # and no tags.
  - id: mail
    tenant: acme
    transport: http
    url: "http://localhost:8101/mcp"
    tools:
      read_email: {risk: low, tags: [reads_untrusted, reads_sensitive]}
      send_email: {risk: high, tags: [external_effect], extract: {recipient_domain: "$.to | domain"}}
  - {id: files, tenant: acme, transport: http, url: "http://localhost:8102/mcp"}
  - {id: bank, tenant: acme, transport: http, url: "http://localhost:8103/mcp"}
  - {id: echo, tenant: acme, transport: http, url: "http://localhost:8104/mcp"}

# How the tool list is kept current. All three can be set with KEYSTONE_REGISTRY__<NAME>.
registry:
  sync_interval_s: 300   # 0 turns the timer off
  sync_timeout_s: 20
  cache_ttl_s: 2
