# Local stack for development and the demo. Host ports are fixed (see .env.example).
# The five demo upstreams (<name>-mcp) are built from deploy/Dockerfile.upstreams, one image.
# Keystone is built from the Dockerfile at the repository root.
# Every image is pinned to an exact tag and listed in docs/adr/0002-dependency-pins.md.
name: keystone

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Every token carries this address as its issuer (iss), whoever asks for it. Keystone reads
      # the discovery document and the keys from http://keycloak:8080 instead; with dynamic
      # backchannel URLs Keycloak answers that request with its own address in jwks_uri.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # DEVELOPMENT ONLY. The realm file (keycloak/realm-keystone.json) holds ${NAME} placeholders
      # for these, and Keycloak fills them from its environment when it imports the realm. The
      # defaults repeat .env.example; tests/unit/test_dev_secrets.py checks that they agree.
      ALICE_PASSWORD: "${ALICE_PASSWORD:-alice-dev-password}"
      OLIVIA_PASSWORD: "${OLIVIA_PASSWORD:-olivia-dev-password}"
      LENA_PASSWORD: "${LENA_PASSWORD:-lena-dev-password}"
      BOB_PASSWORD: "${BOB_PASSWORD:-bob-dev-password}"
      ROOT_PASSWORD: "${ROOT_PASSWORD:-root-dev-password}"
      SUPPORT_AGENT_SECRET: "${SUPPORT_AGENT_SECRET:-support-agent-dev-secret}"
      OPS_AGENT_SECRET: "${OPS_AGENT_SECRET:-ops-agent-dev-secret}"
      KEYSTONE_CLI_SECRET: "${KEYSTONE_CLI_SECRET:-keystone-cli-dev-secret}"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    # The realm is imported only when it does not exist yet, and the development database lives
    # in the container, so `make reset` (or `make down`) followed by `make up` imports the file
    # again. Do not give Keycloak a volume for its data.
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl. Health is served on the management port (9000), so read it
      # with bash's /dev/tcp and look for the UP status in the body.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          while read -r line || [[ -n $$line ]]; do
            [[ $$line == *'"status": "UP"'* ]] && exit 0
          done <&3
          exit 1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:16686/"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  mail-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.mail_server", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      MAIL_API_KEY: "${MAIL_API_KEY:-dev-mail-key-3f9a1c7d}"
      # Three unread emails carry an instruction for the agent that reads them (KS-708), the
      # material of the injection demo. Without this the mailbox is the 12 emails of the seed.
      MAIL_POISONED: "1"
    ports:
      - "${MAIL_PORT:-8101}:8101"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8101/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  files-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.files_server", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      FILES_API_KEY: "${FILES_API_KEY:-dev-files-key-81b2e04f}"
      # Two files carry an instruction for the agent that reads them (KS-708).
      FILES_POISONED: "1"
    ports:
      - "${FILES_PORT:-8102}:8102"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8102/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  bank-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.bank_server", "--host", "0.0.0.0", "--port", "8103"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      BANK_API_KEY: "${BANK_API_KEY:-dev-bank-key-c6d57a92}"
    ports:
      - "${BANK_PORT:-8103}:8103"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8103/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  # The globex tenant's own files server: another drive (examples/fixtures/files-globex) and its
  # own API key. The server reads its key from FILES_API_KEY, like the acme files server.
  files-globex-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.files_server", "--host", "0.0.0.0", "--port", "8112"]
    environment:
      FILES_API_KEY: "${FILES_GLOBEX_API_KEY:-dev-globex-key-5a7c28e6}"
      FILES_SEED: /app/examples/fixtures/files-globex
    ports:
      - "${FILES_GLOBEX_PORT:-8112}:8112"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8112/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  echo-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.echo_server", "--host", "0.0.0.0", "--port", "8104"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      ECHO_API_KEY: "${ECHO_API_KEY:-dev-echo-key-0e4b9d13}"
    ports:
      - "${ECHO_PORT:-8104}:8104"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8104/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  # The web upstream (KS-708): `fetch(url)` returns stored pages, some of which carry an instruction
  # for the agent that reads them. It never reaches the network.
  web-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.web_server", "--host", "0.0.0.0", "--port", "8105"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      WEB_API_KEY: "${WEB_API_KEY:-dev-web-key-9d3b6e21}"
    ports:
      - "${WEB_PORT:-8105}:8105"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8105/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  # A fake of the two model APIs (KS-806, examples/fake_llm), so that the LLM proxy has something to
  # forward to with no provider key and no network. It answers Anthropic's /v1/messages and OpenAI's
  # /v1/chat/completions, whole or as a stream, with token counts that can be worked out by hand.
  fake-llm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.fake_llm.server", "--host", "0.0.0.0", "--port", "8199"]
    environment:
      # The key it wants in x-api-key or as a bearer token. Keystone holds the same value in its
      # vault as the key of both providers, so a request that reaches it without the key is refused.
      FAKE_LLM_API_KEY: "${FAKE_LLM_API_KEY:-dev-fake-llm-key-7c1e5a90}"
    ports:
      - "${FAKE_LLM_PORT:-8199}:8199"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8199/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  # Builds the image that the sandbox runs code in (KS-801). It runs once and exits: Keystone starts
  # its own containers from this image through the Docker socket. It has no network and writes
  # nothing, like the containers made from it.
  sandbox-image:
    build:
      context: ./sandbox
      dockerfile: Dockerfile.python
    image: keystone-sandbox-python:dev
    command: ["python", "-c", "print('sandbox image ready')"]
    network_mode: none
    read_only: true
    restart: "no"

  keystone:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # The classifier behind the scanner's rules, and its model, are in the image (KS-702). The
        # first build downloads the model (738 MB) and torch, and took 20 minutes on a laptop.
        # KEYSTONE_SCANNER_CLASSIFIER=none turns the model off.
        WITH_SCANNER: "1"
    image: keystone:dev
    # --migrate creates the registry tables on first start and is a no-op afterwards.
    command: ["serve", "--host", "0.0.0.0", "--port", "8080", "--migrate"]
    environment:
      KEYSTONE_ENV: dev
      # The demo upstreams are on the compose network, so the SSRF guard (KS-202) must allow them.
      KEYSTONE_ALLOW_PRIVATE_UPSTREAMS: "true"
      # Seconds between upstream health probes. scripts/smoke/phase_2.sh sets a short one.
      KEYSTONE_HEALTH__INTERVAL_S: "${KEYSTONE_HEALTH_INTERVAL_S:-30}"
      KEYSTONE_CONFIG: /etc/keystone/keystone.yaml
      # Keystone runs as keystone_app, which may only add and read audit records (KS-503). The
      # migration at start-up runs as the owner of the tables, and it creates the role with the
      # password below. DEVELOPMENT ONLY: the password repeats .env.example.
      KEYSTONE_DATABASE_URL: "postgresql+asyncpg://keystone_app:${KEYSTONE_APP_DB_PASSWORD:-keystone-app-dev-password}@postgres:5432/keystone"
      KEYSTONE_MIGRATE_DATABASE_URL: postgresql+asyncpg://keystone:keystone@postgres:5432/keystone
      KEYSTONE_APP_DB_PASSWORD: "${KEYSTONE_APP_DB_PASSWORD:-keystone-app-dev-password}"
      KEYSTONE_REDIS_URL: redis://redis:6379/0
      # Spans go to Jaeger over OTLP/HTTP (KS-504). Its UI is on :16686.
      KEYSTONE_OTLP_ENDPOINT: http://jaeger:4318
      # Sign-in (KS-304). Tokens name the address a browser on this machine uses as their issuer.
      # Keystone fetches the discovery document and the keys from the Keycloak container.
      KEYSTONE_AUTH__MODE: oidc
      KEYSTONE_OIDC_ISSUER: "http://localhost:${KEYCLOAK_PORT:-8180}/realms/keystone"
      KEYSTONE_OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/keystone/.well-known/openid-configuration"
      KEYSTONE_PUBLIC_BASE_URL: "http://localhost:${KEYSTONE_PORT:-8080}"
      # The vault (KS-305). DEVELOPMENT ONLY, like the keys below; both repeat .env.example.
      KEYSTONE_MASTER_KEYS: "${KEYSTONE_MASTER_KEYS:-FpAPqO9j92_C-qEbO6vqkdH2olOR4ZHKzRqM7OhjSE0=}"
      # The upstream credentials that keystone.compose.yaml takes from the environment (credential_env).
      # At startup they go into the vault, encrypted. The upstreams above require the same values.
      MAIL_API_KEY: "${MAIL_API_KEY:-dev-mail-key-3f9a1c7d}"
      FILES_API_KEY: "${FILES_API_KEY:-dev-files-key-81b2e04f}"
      BANK_API_KEY: "${BANK_API_KEY:-dev-bank-key-c6d57a92}"
      ECHO_API_KEY: "${ECHO_API_KEY:-dev-echo-key-0e4b9d13}"
      WEB_API_KEY: "${WEB_API_KEY:-dev-web-key-9d3b6e21}"
      FILES_GLOBEX_API_KEY: "${FILES_GLOBEX_API_KEY:-dev-globex-key-5a7c28e6}"
      # The key of the model providers (KS-806). keystone.compose.yaml points both at the fake one,
      # so this is the key that fake-llm wants. For a real provider it is ANTHROPIC_API_KEY or
      # OPENAI_API_KEY, named in llm_proxy.<provider>.api_key_env.
      FAKE_LLM_API_KEY: "${FAKE_LLM_API_KEY:-dev-fake-llm-key-7c1e5a90}"
      # The model behind the scanner's rules: protectai-deberta-v2, prompt-guard-2-86m or none.
      KEYSTONE_SCANNER_CLASSIFIER: "${KEYSTONE_SCANNER_CLASSIFIER:-protectai-deberta-v2}"
      # Other containers reach Keystone by its service name.
      KEYSTONE_ALLOWED_HOSTS: '["127.0.0.1:*", "localhost:*", "[::1]:*", "keystone:*"]'
      # The sandbox (KS-801): code an agent writes runs in containers that Keystone starts. false
      # leaves the `sandbox` upstream unregistered; do that wherever there is no Docker socket.
      KEYSTONE_SANDBOX_ENABLED: "${KEYSTONE_SANDBOX_ENABLED:-true}"
      # The rate limit of one user (KS-804). The other scopes are in keystone.compose.yaml, and all of
      # them are far above what the smoke scripts and the browser test do. scripts/smoke/phase_8.sh
      # sets these two for its burst and puts the defaults back when it ends.
      KEYSTONE_RATE_LIMITS__PER_USER__CAPACITY: "${KEYSTONE_RATE_LIMIT_USER_CAPACITY:-300}"
      KEYSTONE_RATE_LIMITS__PER_USER__REFILL_PER_S: "${KEYSTONE_RATE_LIMIT_USER_REFILL:-50}"
    volumes:
      - ./keystone.compose.yaml:/etc/keystone/keystone.yaml:ro
      # The policies of this checkout, so an edit on the host takes effect on the next reload
      # (keystone policy reload, or SIGHUP). keystone.compose.yaml names this path.
      - ../policies:/etc/keystone/policies:ro
      # The prices the LLM proxy costs a request with (KS-806). These are FAKE prices for the fake
      # models; a real provider needs a pricing.yaml of its real prices (pricing.example.yaml).
      - ./pricing.compose.yaml:/etc/keystone/pricing.yaml:ro
      # LOCAL AND SINGLE-HOST USE ONLY. The Docker socket lets Keystone start the sandbox's
      # containers, and whoever can use it can start any container on the host as root. A
      # Keystone that is compromised owns the machine it runs on. For anything but a laptop, run
      # the sandbox where the daemon is not shared with anything you care about (ADR-0012).
      - /var/run/docker.sock:/var/run/docker.sock
    # Keystone runs as user 10001, which the socket does not let in. Docker Desktop owns it as
    # root:root, so group 0 opens it. On Linux set DOCKER_SOCKET_GID to the group of the socket:
    # stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    ports:
      - "${KEYSTONE_PORT:-8080}:8080"
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mail-mcp:
        condition: service_healthy
      files-mcp:
        condition: service_healthy
      bank-mcp:
        condition: service_healthy
      echo-mcp:
        condition: service_healthy
      web-mcp:
        condition: service_healthy
      files-globex-mcp:
        condition: service_healthy
      fake-llm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  promdata:
  grafanadata:
