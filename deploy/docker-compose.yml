# Local stack for development and the demo. Host ports are fixed (see .env.example).
# The four demo upstreams (<name>-mcp) are built from deploy/Dockerfile.upstreams, one image.
# Keystone is built from the Dockerfile at the repository root.
# Every image is pinned to an exact tag and listed in docs/adr/0002-dependency-pins.md.
name: keystone

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Every token carries this address as its issuer (iss), whoever asks for it. Keystone reads
      # the discovery document and the keys from http://keycloak:8080 instead; with dynamic
      # backchannel URLs Keycloak answers that request with its own address in jwks_uri.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # DEVELOPMENT ONLY. The realm file (keycloak/realm-keystone.json) holds ${NAME} placeholders
      # for these, and Keycloak fills them from its environment when it imports the realm. The
      # defaults repeat .env.example; tests/unit/test_dev_secrets.py checks that they agree.
      ALICE_PASSWORD: "${ALICE_PASSWORD:-alice-dev-password}"
      OLIVIA_PASSWORD: "${OLIVIA_PASSWORD:-olivia-dev-password}"
      LENA_PASSWORD: "${LENA_PASSWORD:-lena-dev-password}"
      BOB_PASSWORD: "${BOB_PASSWORD:-bob-dev-password}"
      ROOT_PASSWORD: "${ROOT_PASSWORD:-root-dev-password}"
      SUPPORT_AGENT_SECRET: "${SUPPORT_AGENT_SECRET:-support-agent-dev-secret}"
      OPS_AGENT_SECRET: "${OPS_AGENT_SECRET:-ops-agent-dev-secret}"
      KEYSTONE_CLI_SECRET: "${KEYSTONE_CLI_SECRET:-keystone-cli-dev-secret}"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    # The realm is imported only when it does not exist yet, and the development database lives
    # in the container, so `make reset` (or `make down`) followed by `make up` imports the file
    # again. Do not give Keycloak a volume for its data.
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl. Health is served on the management port (9000), so read it
      # with bash's /dev/tcp and look for the UP status in the body.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          while read -r line || [[ -n $$line ]]; do
            [[ $$line == *'"status": "UP"'* ]] && exit 0
          done <&3
          exit 1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:16686/"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  mail-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.mail_server", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      MAIL_API_KEY: "${MAIL_API_KEY:-dev-mail-key-3f9a1c7d}"
    ports:
      - "${MAIL_PORT:-8101}:8101"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8101/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  files-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.files_server", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      FILES_API_KEY: "${FILES_API_KEY:-dev-files-key-81b2e04f}"
    ports:
      - "${FILES_PORT:-8102}:8102"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8102/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  bank-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.bank_server", "--host", "0.0.0.0", "--port", "8103"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      BANK_API_KEY: "${BANK_API_KEY:-dev-bank-key-c6d57a92}"
    ports:
      - "${BANK_PORT:-8103}:8103"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8103/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  echo-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstreams
    image: keystone-upstreams:dev
    command: ["examples.upstreams.echo_server", "--host", "0.0.0.0", "--port", "8104"]
    environment:
      # Requests to /mcp need this key in X-Api-Key. Keystone holds it in its vault.
      ECHO_API_KEY: "${ECHO_API_KEY:-dev-echo-key-0e4b9d13}"
    ports:
      - "${ECHO_PORT:-8104}:8104"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8104/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  keystone:
    build:
      context: ..
      dockerfile: Dockerfile
    image: keystone:dev
    # --migrate creates the registry tables on first start and is a no-op afterwards.
    command: ["serve", "--host", "0.0.0.0", "--port", "8080", "--migrate"]
    environment:
      KEYSTONE_ENV: dev
      # The demo upstreams are on the compose network, so the SSRF guard (KS-202) must allow them.
      KEYSTONE_ALLOW_PRIVATE_UPSTREAMS: "true"
      # Seconds between upstream health probes. scripts/smoke/phase_2.sh sets a short one.
      KEYSTONE_HEALTH__INTERVAL_S: "${KEYSTONE_HEALTH_INTERVAL_S:-30}"
      KEYSTONE_CONFIG: /etc/keystone/keystone.yaml
      KEYSTONE_DATABASE_URL: postgresql+asyncpg://keystone:keystone@postgres:5432/keystone
      KEYSTONE_REDIS_URL: redis://redis:6379/0
      # Sign-in (KS-304). Tokens name the address a browser on this machine uses as their issuer.
      # Keystone fetches the discovery document and the keys from the Keycloak container.
      KEYSTONE_AUTH__MODE: oidc
      KEYSTONE_OIDC_ISSUER: "http://localhost:${KEYCLOAK_PORT:-8180}/realms/keystone"
      KEYSTONE_OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/keystone/.well-known/openid-configuration"
      KEYSTONE_PUBLIC_BASE_URL: "http://localhost:${KEYSTONE_PORT:-8080}"
      # The vault (KS-305). DEVELOPMENT ONLY, like the keys below; both repeat .env.example.
      KEYSTONE_MASTER_KEYS: "${KEYSTONE_MASTER_KEYS:-FpAPqO9j92_C-qEbO6vqkdH2olOR4ZHKzRqM7OhjSE0=}"
      # The upstream credentials that keystone.compose.yaml takes from the environment (credential_env).
      # At startup they go into the vault, encrypted. The upstreams above require the same values.
      MAIL_API_KEY: "${MAIL_API_KEY:-dev-mail-key-3f9a1c7d}"
      FILES_API_KEY: "${FILES_API_KEY:-dev-files-key-81b2e04f}"
      BANK_API_KEY: "${BANK_API_KEY:-dev-bank-key-c6d57a92}"
      ECHO_API_KEY: "${ECHO_API_KEY:-dev-echo-key-0e4b9d13}"
      # Other containers reach Keystone by its service name.
      KEYSTONE_ALLOWED_HOSTS: '["127.0.0.1:*", "localhost:*", "[::1]:*", "keystone:*"]'
    volumes:
      - ./keystone.compose.yaml:/etc/keystone/keystone.yaml:ro
    ports:
      - "${KEYSTONE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mail-mcp:
        condition: service_healthy
      files-mcp:
        condition: service_healthy
      bank-mcp:
        condition: service_healthy
      echo-mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  promdata:
  grafanadata:
