# Keystone's settings inside the compose stack. The upstream URLs use the service names.
# Environment variables in docker-compose.yml override anything set here.
log_level: info

# Two tenants on one Keystone. A token's `tenant` claim picks one, and a caller sees only its own
# tenant's upstreams and tools (KS-307).
tenants:
  - id: acme
    name: Acme Corp
  - id: globex
    name: Globex Inc

# Where the policies are (KS-403): the checkout's policies/ directory, mounted by docker-compose.yml.
# demo/ holds the rules that go with the demo upstreams.
policy:
  root: /etc/keystone/policies
  include_demo: true

# How fast calls may come (KS-804): a token bucket for each scope, `capacity` calls at once and
# `refill_per_s` more every second. These are far above what the smoke scripts and the browser test
# do, so that they never meet one; a deployment sets what it wants. The limit of one user is set in
# docker-compose.yml, where scripts/smoke/phase_8.sh can tighten it for its burst. A virtual tool
# and a call that waits for approval count like any other call.
rate_limits:
  per_tenant: {capacity: 1200, refill_per_s: 200}
  per_agent: {capacity: 600, refill_per_s: 100}

# A call the policy sends to approval is held this long (the default is 60 s), then the agent is
# told KS_APPROVAL_PENDING with an id and waits with keystone__await_approval (ADR-0010). The demo
# and the smoke scripts do not want to wait a minute to see a timeout.
approvals:
  wait_seconds: 10

# Who may connect (KS-308): the OAuth clients of the Keycloak realm that act for users. The
# issuer and the keys come from the environment (docker-compose.yml).
agents:
  support-agent: {trust: standard}
  ops-agent: {trust: high}

# The HTTP upstreams require an API key. `credential_env` names the variable that holds it
# (docker-compose.yml sets them); Keystone stores the value encrypted in its vault at startup and
# adds it to every call, so no agent and no file here holds it.
upstreams:
  - id: mail
    tenant: acme
    transport: http
    url: "http://mail-mcp:8101/mcp"
    credential_mode: static
    credential_env: {X-Api-Key: MAIL_API_KEY}
    # How risky each tool is, and what a policy may read of a call (KS-406). A tool left out is
    # medium risk and exposes nothing. Sending mail is high risk, so only operators may do it, and
    # the recipient's domain is what the mail rule looks at.
    tools:
      list_emails: {risk: low, tags: [reads_sensitive]}
      read_email: {risk: low, tags: [reads_untrusted, reads_sensitive]}
      send_email: {risk: high, tags: [external_effect], extract: {recipient_domain: "$.to | domain"}}
  - id: files
    tenant: acme
    transport: http
    url: "http://files-mcp:8102/mcp"
    credential_mode: static
    credential_env: {X-Api-Key: FILES_API_KEY}
    # What each tool is to the Rule of Two (policies/default/approval/rule_of_two.cedar). A drive
    # holds files that people outside the company wrote or touched, and private ones, so a read is
    # untrusted and sensitive; a write changes state. A tool with no tag is invisible to the rule.
    tools:
      list_files: {risk: medium, tags: [reads_sensitive]}
      read_file: {risk: medium, tags: [reads_untrusted, reads_sensitive]}
      write_file: {risk: medium, tags: [external_effect]}
  - id: bank
    tenant: acme
    transport: http
    url: "http://bank-mcp:8103/mcp"
    credential_mode: static
    credential_env: {X-Api-Key: BANK_API_KEY}
    # A transfer is high risk. The amount is read in cents ($.amount | cents), because `int` would
    # cut 500.99 down to 500 and let it past a limit of 500.
    tools:
      get_balance: {risk: medium, tags: [reads_sensitive]}
      # The description of a transaction is written by whoever paid or was paid, so reading the
      # history is a read of untrusted text as well as of private data.
      list_transactions: {risk: medium, tags: [reads_untrusted, reads_sensitive]}
      transfer: {risk: high, tags: [external_effect], extract: {amount: "$.amount | cents"}}
  - id: echo
    tenant: acme
    transport: http
    url: "http://echo-mcp:8104/mcp"
    credential_mode: static
    credential_env: {X-Api-Key: ECHO_API_KEY}
  # Pages from the web (KS-708). What a page says was written by someone outside the company, so
  # fetching one is a read of untrusted text: the tool is tagged reads_untrusted. The server keeps
  # fixture pages and never reaches the network.
  - id: web
    tenant: acme
    transport: http
    url: "http://web-mcp:8105/mcp"
    credential_mode: static
    credential_env: {X-Api-Key: WEB_API_KEY}
    tools:
      fetch: {risk: low, tags: [reads_untrusted]}
  # Globex's own drive. An upstream id is unique across tenants, so it is not called `files`.
  - id: files_globex
    tenant: globex
    transport: http
    url: "http://files-globex-mcp:8112/mcp"
    credential_mode: static
    credential_env: {X-Api-Key: FILES_GLOBEX_API_KEY}
  # A demo MCP server that Keystone starts itself and talks to over stdin and stdout. The working
  # directory of the container is /app, where the image keeps `examples`.
  - id: echostd
    tenant: acme
    transport: stdio
    command: [python, -m, examples.upstreams.echo_server, --transport, stdio]
    # The one tool of the local stack that has a price, a cent a call, so that a budget has
    # something to count (KS-805). The tests that use the demo upstreams read the tools of the other
    # upstreams from this file, which is why the price is here and not on the HTTP echo.
    tools:
      echo: {cost_per_call_usd: 0.01}
  # The sandbox (KS-802): code an agent writes runs in a container that Keystone starts, with no
  # network (ADR-0012). Both tools are high risk with the tag code_exec, so by the default access
  # policy only operators may call them, and a user in support does not see them. The Docker socket
  # that this needs is mounted by docker-compose.yml. KEYSTONE_SANDBOX_ENABLED=false leaves it out.
  - {id: sandbox, tenant: acme, transport: builtin}

# Spending limits (KS-805): a call that would take the spend over one is refused before it runs,
# with KS_BUDGET_EXCEEDED. Days and months are counted in UTC. Lena has three cents a day, which is
# three calls of echostd__echo, for scripts/smoke/phase_8.sh. The tenant has $25 a day, far above
# what the stack spends, so that the console has a second bar to show.
budgets:
  - {tenant: acme, scope: user, scope_id: lena, window: day, limit_usd: 0.03}
  - {tenant: acme, scope: tenant, window: day, limit_usd: 25}

# The LLM proxy (KS-806): an agent sends its model requests to Keystone instead of to the provider,
# with its Keystone token as the API key. Keystone checks the token, stops a request that would
# take a budget over its limit, adds the provider's key from the vault and books what the request
# cost. Here both providers are the fake one (examples/fake_llm, the fake-llm service), so the stack
# needs no key and no network, and the prices are fake (pricing.compose.yaml).
#
# For a real provider: put its URL in base_url, its key in the variable that api_key_env names,
# and the provider's real prices in a pricing.yaml of your own (pricing.example.yaml shows the shape
# and says whose job the prices are). The key never appears in this file.
llm_proxy:
  enabled: true
  tenant: acme
  pricing_file: /etc/keystone/pricing.yaml
  anthropic: {base_url: "http://fake-llm:8199", api_key_env: FAKE_LLM_API_KEY}
  openai: {base_url: "http://fake-llm:8199", api_key_env: FAKE_LLM_API_KEY}
